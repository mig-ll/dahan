<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ruleta de Palabras</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f5f5f5;
    }

    .wheel-container {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 10px solid #333;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    .wheel {
      width: 100%;
      height: 100%;
      transform: rotate(0deg);
      transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
    }

    .segment {
      position: absolute;
      width: 50%;
      height: 50%;
      top: 50%;
      left: 50%;
      transform-origin: 0% 0%;
      background: hsl(0, 100%, 80%);
      clip-path: polygon(0 0, 100% 0, 0 100%);
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding-left: 10px;
      font-size: 14px;
      font-weight: bold;
    }

    .indicator {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 30px solid red;
      position: absolute;
      top: -30px;
      left: calc(50% - 20px);
    }

    button {
      margin-top: 40px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="wheel-container">
    <div class="indicator"></div>
    <div id="wheel" class="wheel"></div>
  </div>

  <button onclick="spin()">Girar Ruleta</button>
  
  <div id="result"></div>

  <button onclick="leerTexto()" style="margin-top: 10px;">Escuchar pronunciación</button>

  <script>
    const words = ["sword","helmet","crown","necklace","belt","bracelet","shield","knight","queen","timeline","midnight","sunscreen","storyteller","terrified","exhibit","century","castle","mountain","forest","town","field","lake","island","river","path","waiter","careful","rhino","awake","no problem","continent","satellite","outdoors","expensive","delicious","cheap","excellent","deep","top","scare","enormous","brave","fire","flood","police car","police officer","fire engine","firefighter","ambulance","paramedic","emergency","danger","extinguisher","donkey","strange","snow","ice","riverbank","land","wave","in pain","broken","competition","bandage","entrance","full","flashlight","east","empty","stairs","escalator","ticket office","platform","engineer","station","backpack","suitcase","spring","summer","fall","winter","o’clock","brain","date","road","bike","fuel","during","everywhere","dark","beard","curly","mustache","light","scar","blond","straight","criminal","mysterious","thumb","thin","bald","wavy","slim","skinny","athletic","curvy","handsome","cookie","creature","spacesuit","flashlight","unhappy","wonderful","untidy","wing","horn","back","scales","neck","tail","feathers","tongue","beak","myth","omnivores","Pegasus","mermaid","unicorn","phoenix","centaur","the sphinx","cellar","beautiful","dangerous","heavy","interesting","friendly","favorite","scary","trombone","triangle","keyboard","drums","tambourine","saxophone","trumpet","violin","harp","orchestra","guitar","drummer","band","harpist","conductor","baton","recorder","bow","deep","nervous","excited","sleepy","comet","star","rocket","planet","moon","telescope","astronaut","space station","planetarium","outer space","Mercury","Venus","Earth","Mars","Jupiter","Saturn","Uranus","Neptune"];
    const wheel = document.getElementById('wheel');
    const result = document.getElementById('result');

    const segmentAngle = 360 / words.length;
    let selectWord;

    // Crear los segmentos de la ruleta
    words.forEach((word, i) => {
      const segment = document.createElement('div');
      segment.className = 'segment';
      segment.style.transform = `rotate(${i * segmentAngle}deg)`;
      segment.style.background = `hsl(${i * 360 / words.length}, 100%, 80%)`;
      segment.innerText = ""; //word
      wheel.appendChild(segment);
    });

    let currentRotation = 0;

    function spin() {
      const randomIndex = Math.floor(Math.random() * words.length);
      const rotation = 360 * 5 + (360 - randomIndex * segmentAngle - segmentAngle / 2); // 5 vueltas + caer en el segmento
      currentRotation += rotation;

      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        selectWord = words[randomIndex];
        result.textContent = `Palabra seleccionada: ${words[randomIndex]}`;
      }, 4000);
    }

    function leerTexto() {
      if (!selectWord) return;
      const utterance = new SpeechSynthesisUtterance(selectWord);
      utterance.lang = "en-US";
      speechSynthesis.speak(utterance);
    }


  </script>

</body>
</html>
